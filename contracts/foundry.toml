[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "../deployments" }]

[rpc_endpoints]
xlayer_testnet = "${XLAYER_TESTNET_RPC}"
xlayer_mainnet = "${XLAYER_MAINNET_RPC}"

# OKLink supports Foundry verification through its oklink verifier plugin endpoint.
# Usage example:
# forge verify-contract <address> src/MyContract.sol:MyContract \
#   --chain 1952 --verifier oklink \
#   --verifier-url https://www.oklink.com/api/v5/explorer/contract/verify-source-code-plugin/XLAYER_TESTNET \
#   --api-key $OKLINK_API_KEY
[etherscan]
xlayer_testnet = { key = "${OKLINK_API_KEY}", url = "https://www.oklink.com/api/v5/explorer/contract/verify-source-code-plugin/XLAYER_TESTNET", chain = 1952 }
xlayer_mainnet = { key = "${OKLINK_API_KEY}", url = "https://www.oklink.com/api/v5/explorer/contract/verify-source-code-plugin/XLAYER", chain = 196 }
